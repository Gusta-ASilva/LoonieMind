[project]
name = "looniemind"
version = "1.1.0"
description = "Gestão e previsão financeira local para pequenas empresas"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
