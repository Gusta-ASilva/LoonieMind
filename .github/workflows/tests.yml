name: Testes do LoonieMind
on:
  push:
  pull_request:
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m ruff check looniemind scripts tests run.py
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: node --check web/charts.js
      - run: node --check web/icons.js
      - run: node --check web/api-reference.js
